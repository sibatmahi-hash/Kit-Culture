<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <!-- CSS Styling -->
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f5f9;
      color: #333;
      padding: 40px 15px;
      margin: 0;
    }

    .wrapper {
      max-width: 520px;
      margin: 0 auto;
    }

    .back-link {
      color: #124e47;
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 20px;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 24px;
      color: #124e47;
    }

    /* Order Summary Box */
    .order-summary {
      background-color: #fbfdfd;
      border: 1px solid #e2e8e7;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 25px;
    }

    .order-summary h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 16px;
      color: #124e47;
    }

    .order-summary p {
      margin: 6px 0;
      font-size: 15px;
      color: #4a5568;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
    }

    .summary-row.total {
      font-weight: bold;
      color: #124e47;
      font-size: 1.1em;
      border-top: 1px dashed #cbd5e1;
      padding-top: 8px;
      margin-top: 8px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
      color: #2d3748;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      background-color: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: hsl(123, 83%, 43%);
      box-shadow: 0 0 0 3px #08b83426;
    }

    /* Button */
    .btn {
      width: 100%;
      background-color: #1dda1d;
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 5px;
    }

    .btn:hover {
      background-color: #1fd60e;
    }

    /* Thank You Message */
    #thank-you-message {
      display: none; /* hidden by default */
      text-align: center;
      padding: 40px 20px;
    }

    #thank-you-message h2 {
      color: #124e47;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <a class="back-link" href="index.html">&larr; Back to Shop</a>

    <div class="card" id="checkout-container">
      <h2>Complete Your Order</h2>

      <!-- Dynamic Order Summary -->
      <div class="order-summary">
        <h3>Order Summary</h3>
        <p><strong>Item:</strong> <span id="summary-name">Loading...</span></p>
        <p><strong>Size:</strong> <span id="summary-size">Not selected</span></p>
        <div class="summary-row">
          <span>Item Price:</span>
          <span><span id="summary-price">0</span> BDT</span>
        </div>
        <div class="summary-row">
          <span>Delivery Charge:</span>
          <span><span id="summary-delivery">0</span> BDT</span>
        </div>
        <div class="summary-row total">
          <span>Grand Total:</span>
          <span><span id="summary-grand-total">0</span> BDT</span>
        </div>
      </div>

      <form id="checkout-form" onsubmit="handleOrder(event)">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" required>
        </div>

        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" required>
        </div>

        <div class="form-group">
          <label for="address">Delivery Address</label>
          <textarea id="address" rows="3" required></textarea>
        </div>

        <!-- NEW: Delivery Location Option -->
        <div class="form-group">
          <label for="delivery-location">Delivery Area</label>
          <select id="delivery-location" onchange="updateTotals()" required>
            <option value="60">Inside Narsingdi (60 BDT)</option>
            <option value="120">Outside Narsingdi (120 BDT)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="payment-method">Payment Method</label>
          <select id="payment-method">
            <option value="Cash on Delivery (COD)">Cash on Delivery (COD)</option>
          </select>
        </div>

        <button type="submit" class="btn">Confirm Order</button>
      </form>
    </div>

    <!-- Thank You Message -->
    <div class="card" id="thank-you-message">
      <h2>Thank You!</h2>
      <p>Your order request has been processed. Check your inbox for confirmation.</p>
    </div>
  </div>

  <script>
    // Initialize EmailJS safely
    let emailJSLoaded = false;
      window.onload = function() {
      if (typeof emailjs !== 'undefined') {
        emailjs.init("3CKjsxaNy_Wp8Y7vI");
        console.log("EmailJS loaded successfully.");
      } else {
        console.error("EmailJS failed to load. Check your internet connection.");
      }
    };

    const products = {
      "101": { name: "Argentina Home Jersey", price: "1150 BDT" },
      "102": { name: "Real Madrid Home Jersey", price: "980 BDT" },
      "103": { name: "Barcelona Home Jersey", price: "900 BDT" }
    };

    // Extract product ID and size from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');
    const size = urlParams.get('size');

    let rawPrice = 0;

    if (products[productId]) {
      document.getElementById('summary-name').innerText = products[productId].name;
      document.getElementById('summary-price').innerText = products[productId].price;
      
      // Convert price string (e.g., "1150 BDT") into a clean number (1150)
      rawPrice = parseFloat(products[productId].price.replace(/[^0-9.]/g, '')) || 0;
    }
    
    if (size) {
      document.getElementById('summary-size').innerText = size;
    } else {
      document.getElementById('summary-size').innerText = 'Not selected';
    }

    // Function to calculate delivery and grand total dynamically
    function updateTotals() {
      const deliverySelect = document.getElementById('delivery-location');
      const deliveryCharge = parseFloat(deliverySelect.value) || 0;
      const grandTotal = rawPrice + deliveryCharge;

      document.getElementById('summary-delivery').innerText = deliveryCharge;
      document.getElementById('summary-grand-total').innerText = grandTotal;
    }

    // Run initial calculation when page loads
    updateTotals();

    function handleOrder(e) {
      e.preventDefault();

      if (typeof emailjs === 'undefined') {
        alert("Email service is still loading or blocked. Please refresh the page.");
        return;
      }

      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const gmail = document.getElementById('email').value;
      const address = document.getElementById('address').value;
      const payment = document.getElementById('payment-method').value;
      
      // Get selected delivery area text and charge value
      const deliverySelect = document.getElementById('delivery-location');
      const deliveryAreaText = deliverySelect.options[deliverySelect.selectedIndex].text;
      const deliveryCharge = deliverySelect.value;
      const grandTotal = rawPrice + parseFloat(deliveryCharge);

      const itemName = document.getElementById('summary-name').innerText;
      const itemSize = document.getElementById('summary-size').innerText;
      const itemPrice = document.getElementById('summary-price').innerText;

      // Disable button while sending
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.innerText = "Processing...";
      submitBtn.disabled = true;

      emailjs.send("service_o66sw8e", "template_2srtjbo", {
        to_email: "kitculture0@gmail.com",
        customer_name: name,
        customer_phone: phone,
        customer_gmail: gmail,
        customer_address: address,
        delivery_area: deliveryAreaText,
        delivery_charge: deliveryCharge + " BDT",
        grand_total: grandTotal + " BDT",
        payment_method: payment,
        item_name: itemName,
        item_size: itemSize,
        item_price: itemPrice
      })
      .then(function(response) {
        document.getElementById('checkout-container').style.display = 'none';
        document.getElementById('thank-you-message').style.display = 'block';
      }, function(error) {
        console.error("EmailJS error:", error);
        alert("Failed to send order. Please try again.");
        submitBtn.innerText = "Confirm Order";
        submitBtn.disabled = false;
      });
    }
  </script>
</body>
</html>
