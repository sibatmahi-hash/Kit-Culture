<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    
    <!-- 1. Place CDN script inside <head> without async/defer attributes -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<a id="back-link" href="index.html">&larr; Back to Shop</a>
<h2>Complete Your Order</h2>

<div id="checkout-container">
    <!-- Dynamic Order Summary -->
    <div class="order-summary">
        <h3>Order Summary</h3>
        <p><strong>Item:</strong> <span id="summary-name">Loading...</span></p>
        <p><strong>Size:</strong> <span id="summary-size"></span></p>
        <p><strong>Total Price:</strong> <span id="summary-price"></span></p>
    </div>

    <form id="checkout-form" onsubmit="handleOrder(event)">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" required>
        </div>

        <div class="form-group">
            <label for="address">Delivery Address</label>
            <textarea id="address" rows="3" required></textarea>
        </div>

        <div class="form-group">
            <label for="payment-method">Payment Method</label>
            <select id="payment-method">
                <option value="bKash (Send Money)">bKash (Send Money)</option>
                <option value="Nagad (Send Money)">Nagad (Send Money)</option>
                <option value="Cash on Delivery (COD)">Cash on Delivery (COD)</option>
            </select>
        </div>

        <button type="submit" class="btn">Confirm Order</button>
    </form>
</div>

<!-- Thank You Message -->
<div id="thank-you-message">
    <h2>Thank You!</h2>
    <p>Your order request has been processed. Check your inbox for confirmation.</p>
</div>
 <script>
    // Initialize EmailJS safely after window fully loads
    window.onload = function() {
        if (typeof emailjs !== 'undefined') {
            emailjs.init({
                publicKey: "FyiwLZMaIvs-p2uWp" // Replace with your actual Public Key
            });
            console.log("EmailJS loaded successfully.");
        } else {
            console.error("EmailJS failed to load. Check your internet connection.");
        }
    };

    const products = {
        "101": { name: "Argentina Home Jersey", price: "799 BDT" },
        "102": { name: "Real Madrid Home Jersey", price: "900 BDT" },
        "103": { name: "Barcelona Home Jersey", price: "900 BDT" }
    };

    // Extract product ID and size from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');
    const size = urlParams.get('size');

    if (products[productId]) {
        document.getElementById('summary-name').innerText = products[productId].name;
        document.getElementById('summary-price').innerText = products[productId].price;
        document.getElementById('summary-size').innerText = size || 'Not selected';
    }

    function handleOrder(e) {
        e.preventDefault();

        // Safety check before sending
        if (typeof emailjs === 'undefined') {
            alert("Email service is still loading or blocked. Please refresh the page.");
            return;
        }

        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const address = document.getElementById('address').value;
        const payment = document.getElementById('payment-method').value;
        const itemName = document.getElementById('summary-name').innerText;
        const itemSize = document.getElementById('summary-size').innerText;
        const itemPrice = document.getElementById('summary-price').innerText;

        emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
            to_email: "sibatmahi@gmail.com",
            customer_name: name,
            customer_phone: phone,
            customer_address: address,
            payment_method: payment,
            item_name: itemName,
            item_size: itemSize,
            item_price: itemPrice
        }).then(function(response) {
            document.getElementById('checkout-container')?.style.setProperty('display', 'none');
            document.getElementById('back-link')?.style.setProperty('display', 'none');
            document.getElementById('thank-you-message')?.style.setProperty('display', 'block');
        }, function(error) {
            alert("Failed to place order. Please try again.");
            console.error("EmailJS Error:", error);
        });
    }
</script>
</body>
</html>
