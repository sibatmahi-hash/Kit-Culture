<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Details</title>
  <style>
    body { 
      font-family: sans-serif; 
      padding: 20px; 
    }
    .container { 
      display: flex; 
      gap: 30px; 
    }
    .details { 
      max-width: 400px; 
    }
    .buy-btn { 
      background-color: #f57224; 
      color: white; 
      padding: 10px 20px; 
      border: none; 
      font-size: 16px; 
      cursor: pointer; 
      border-radius: 4px; 
    }

    /* Multi-Image Gallery Styles */
    .gallery-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #jersey-img {
      border-radius: 6px;
      object-fit: cover;
    }
    .thumbnail-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      max-width: 300px;
    }
    .thumbnail {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border: 2px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }
    .thumbnail.active, .thumbnail:hover {
      border-color: #f57224;
    }
  </style>
</head>
<body>

  <a href="index.html">← Back to Shop</a>

  <div class="container" style="margin-top: 20px;">
    
    <!-- Image & Gallery Section -->
    <div class="gallery-container">
      <img id="jersey-img" src="" width="300" alt="Jersey Image">
      <div id="thumbnail-list" class="thumbnail-list"></div>
    </div>

    <!-- Product Details Section -->
    <div class="details">
      <h1 id="jersey-title">Loading...</h1>
      <h2 id="jersey-price"></h2>
      <p id="jersey-details"></p>

      <label for="size">Select Size:</label>
      <select id="size">
        <option>Medium (M)</option>
        <option>Large (L)</option>
        <option>Extra Large (XL)</option>
      </select>

      <br><br>
      <button class="buy-btn" onclick="goToCheckout()">Buy Now</button>
    </div>

  </div>

  <script>
    // Product Database with Multiple Images
    const products = {
      "101": {
        name: "Argentina Home Jersey",
        price: "<del>1150</del> 1050 BDT",
        images: [
          "Screenshot 2026-08-06 212148.png",
          "arg_back.png",
          "arg_badge.png",
          "arg_tag.png"
        ],
        details: "100% Polyester, breathable fabric, standard fit."
      },
      "102": {
        name: "Real Madrid Home Jersey",
        price: "900 BDT",
        images: [
          "Screenshot 2026-08-06 215419.png",
          "real_back.png",
          "real_collar.png",
          "real_badge.png"
        ],
        details: "Official club crest, moisture-absorbing AEROREADY technology."
      },
      "103": {
        name: "Barcelona Home Jersey",
        price: "900 BDT",
        images: [
          "Screenshot 2026-08-07 100954.png",
          "barca_back.png",
          "barca_crest.png"
        ],
        details: "Lightweight fabric, classic striped design."
      }
    };

    // Extract product ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    // Display Product Details & Render Image Gallery
    if (products[productId]) {
      const product = products[productId];

      document.getElementById('jersey-title').innerText = product.name;
      document.getElementById('jersey-price').innerHTML = product.price;
      document.getElementById('jersey-details').innerText = product.details;

      // Set Main Image
      const mainImg = document.getElementById('jersey-img');
      mainImg.src = product.images[0];

      // Render Thumbnails
      const thumbContainer = document.getElementById('thumbnail-list');
      thumbContainer.innerHTML = '';

      product.images.forEach((imgUrl, index) => {
        const thumb = document.createElement('img');
        thumb.src = imgUrl;
        thumb.className = index === 0 ? 'thumbnail active' : 'thumbnail';
        
        // Switch main image when thumbnail is clicked
        thumb.onclick = function() {
          mainImg.src = imgUrl;
          document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
          thumb.classList.add('active');
        };

        thumbContainer.appendChild(thumb);
      });

    } else {
      document.getElementById('jersey-title').innerText = "Product Not Found";
    }

    // Redirect to Checkout Page
    function goToCheckout() {
      const selectedSize = document.getElementById('size').value;
      if (productId) {
        window.location.href = `checkout.html?id=${productId}&size=${selectedSize}`;
      }
    }
  </script>
</body>
</html>
