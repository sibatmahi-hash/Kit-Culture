<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jersey Store - Home</title>
    <style>
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; /* Reduced gap between cards */
            font-family: sans-serif; 
            max-width: 500px; /* Keeps layout compact like reference site */
            margin: 0 auto;
        }

        .product-card { 
            border: 1px solid #eee; 
            padding: 8px; /* Compact padding */
            border-radius: 4px; 
            text-decoration: none; 
            color: #333; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            background: #fff;
        }

        .product-card img { 
            width: 100%; 
            height: auto;
            border-radius: 2px; 
        }

        /* Smaller, left-aligned title */
        .product-card h3 {
            font-size: 14px;
            font-weight: 600;
            margin: 8px 0 4px 0;
            line-height: 1.2;
            color: #222;
        }

        /* Price styling: Light deleted price, dark main price */
        .price-container {
            font-size: 13px;
            margin-bottom: 8px;
        }

        .price-container del {
            color: #999; /* Light gray for old price */
            font-weight: normal;
            margin-right: 5px;
        }

        .price-container .current-price {
            color: #b12704; /* Dark/Bold price */
            font-weight: bold;
        }

        /* Green Order Now Button */
        .order-btn {
            display: block;
            background-color: #3b7135;
            color: #ffffff;
            text-align: center;
            padding: 8px 0;
            font-weight: bold;
            font-size: 13px;
            border-radius: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="product-grid">
        <!-- Product 1 -->
        <a href="product.html?id=101" class="product-card">
            <img src="Screenshot 2026-08-06 212148.png" alt="Argentina Home Jersey">
            <h3>Argentina 2026/27 Home</h3>
            <div class="price-container">
                <del>1,199.00৳</del>
                <span class="current-price">1,050.00৳</span>
            </div>
            <span class="order-btn">Order Now</span>
        </a>

        <!-- Product 2 -->
        <a href="product.html?id=102" class="product-card">
            <img src="Screenshot 2026-08-06 215419.png" alt="Real Madrid Home Jersey">
            <h3>Real Madrid 2026/27 Home</h3>
            <div class="price-container">
                <del>1,199.00৳</del>
                <span class="current-price">1,050.00৳</span>
            </div>
            <span class="order-btn">Order Now</span>
        </a>

        <!-- Product 3 -->
        <a href="product.html?id=103" class="product-card">
            <img src="Screenshot 2026-08-07 100954.png" alt="Barcelona Home Jersey">
            <h3>FC Barcelona 2026/27 Home</h3>
            <div class="price-container">
                <del>1,199.00৳</del>
                <span class="current-price">1,050.00৳</span>
            </div>
            <span class="order-btn">Order Now</span>
        </a>
    </div>

</body>
</html>
