<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jersey Store - Home</title>
    <style>
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            font-family: sans-serif; 
            max-width: 800px;
            margin: 0 auto;
        }

        .product-card { 
            border: 1px solid #e0e0e0; 
            padding: 12px; 
            border-radius: 8px; 
            text-decoration: none; 
            color: #333; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .product-card img { 
            width: 100%; 
            height: auto;
            border-radius: 5px; 
        }

        .order-btn {
            display: block;
            background-color: #3b7135;
            color: #ffffff;
            text-align: center;
            padding: 10px 0;
            font-weight: bold;
            font-size: 14px;
            border-radius: 4px;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .product-card:hover .order-btn {
            background-color: #2e5929;
        }
    </style>
</head>
<body>
    <h1>Featured Jerseys</h1>

    <div class="product-grid">
        <a href="product.html?id=101" class="product-card">
            <img src="Screenshot 2026-08-06 212148.png" alt="Argentina Home Jersey">
            <s><h3>Argentina Home Jersey</h3></s>
             <s><h4>price:<del>1150</del><br>1050</h4></s>
            <span class="order-btn">Order Now</span>
        </a>

        <a href="product.html?id=102" class="product-card">
            <img src="Screenshot 2026-08-06 215419.png" alt="Real Madrid Home Jersey">
            <s><h3>Real Madrid Home Jersey</h3></s>
            <s><h4>price:<del>1150</del><br>1050</h4></s>
            <span class="order-btn">Order Now</span>
        </a>

        <a href="product.html?id=103" class="product-card">
            <img src="Screenshot 2026-08-07 100954.png" alt="Barcelona Home Jersey">
            <s><h3>Barcelona Home Jersey</h3></s>
            <s><h4>price:<del>1150</del><br>1050</h4></s>
            <span class="order-btn">Order Now</span>
        </a>
    </div>
</body>
</html>
